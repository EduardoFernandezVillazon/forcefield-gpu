name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # lavapipe: Mesa's software Vulkan, so the GPU tests run on a runner without a GPU
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - run: cargo build
      - run: cargo test -- --nocapture
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check
